blueprint:
  name: "Topology: close the sun-side covers before sunset"
  description: |-
    Close the covers in the areas whose glazed openings face the setting sun, and skip any area that currently
    has a perimeter opening standing open.

    **Topology picks the areas for you.** Pick the facade — `W` for the evening sun, `E` for the morning — and
    the automation asks Topology, at run time, which areas actually have a glazed opening on that side. Add a
    window later and it is included on the next run; no list to maintain here.

    **The open/closed guard.** Closing a cover over a terrace door somebody just walked through is the classic
    failure of this automation. `binary_sensor.topology_perimeter_open` knows which areas have an opening
    standing open — including openings you never listed anywhere, because the perimeter is derived from the
    trust delta rather than hand-maintained.

    **Prerequisite:** the areas need their `beyond` sides annotated (which wall faces open air) and their
    windows recorded as exterior connections with a cardinal side. The panel's exterior editor does both. Areas
    that face the sun but are not annotated simply do not appear — run `topology.get_health` if the result
    looks short.
  domain: automation
  author: jpawlowski
  source_url: >-
    https://github.com/jpawlowski/hass.topology/blob/main/blueprints/automation/topology/sun_side_covers.yaml
  homeassistant:
    min_version: 2026.7.0
  input:
    geometry:
      name: Which side of the house
      icon: mdi:weather-sunset-down
      input:
        facade_sides:
          name: Facing sides
          description: >-
            The cardinal sides the sun hits at the time this runs. `W` for a sunset trigger, `E` if you switch
            the trigger to sunrise. Topology resolves these to areas on every run.
          default: [W]
          selector:
            select:
              multiple: true
              options:
                - label: North
                  value: "N"
                - label: East
                  value: "E"
                - label: South
                  value: "S"
                - label: West
                  value: "W"
        glazed_only:
          name: Glazed openings only
          description: >-
            Leave enabled so a solid outside door on that facade does not pull its whole area in. Disable if you
            also shade non-glazed openings.
          default: true
          selector:
            boolean:
        excluded_covers:
          name: Covers to leave alone
          description: >-
            Individual covers inside those areas that should never be moved by this automation — a skylight, a
            garage door, an awning you control separately.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: cover
    timing:
      name: When to run
      icon: mdi:clock-outline
      input:
        sunset_offset:
          name: Offset from sunset
          description: >-
            A negative offset runs before sunset, a positive one after. Format `HH:MM:SS`, for example
            `-00:45:00` for three quarters of an hour before sunset.
          default: "-00:30:00"
          selector:
            text:
    behavior:
      name: Behavior
      icon: mdi:tune
      collapsed: true
      input:
        target_position:
          name: Target position
          description: >-
            `0` fully closes the covers with `cover.close_cover`. Any other value sets that position instead,
            which needs covers that support positioning.
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        skip_open_areas:
          name: Skip areas with an open perimeter opening
          description: >-
            Leave enabled to skip any area listed in the `open_connections` attribute of
            `binary_sensor.topology_perimeter_open` — somebody is on the terrace, or a window is open there.
          default: true
          selector:
            boolean:

mode: single
max_exceeded: silent

triggers:
  - trigger: sun
    event: sunset
    offset: !input sunset_offset

actions:
  - alias: "Ask Topology which areas face the sun right now"
    action: topology.get_connections_facing_outdoor
    data:
      side: !input facade_sides
      glazed_only: !input glazed_only
    response_variable: topology_facing
  - alias: "Find the areas Topology reports as open right now"
    variables:
      topology_open_areas: >-
        {% if skip_open_areas %}
          {{ (state_attr('binary_sensor.topology_perimeter_open', 'open_connections') or [])
             | map(attribute='area_id') | unique | list }}
        {% else %}
          {{ [] }}
        {% endif %}
  - alias: "Collect the covers to move"
    variables:
      topology_covers: >-
        {{ topology_facing.area_ids
           | reject('in', topology_open_areas)
           | map('area_entities') | sum(start=[])
           | select('match', 'cover\\.')
           | reject('in', excluded_covers)
           | unique | list }}
  - alias: "Move them, unless everything was skipped"
    choose:
      - alias: "Nothing left to move"
        conditions:
          - condition: template
            value_template: "{{ topology_covers | count == 0 }}"
        sequence:
          - action: logbook.log
            data:
              name: Topology
              message: >-
                No sun-side covers to close — {{ topology_facing.area_ids | count }} area(s) face the chosen
                side, {{ topology_open_areas | count }} skipped for an open perimeter opening.
      - alias: "Fully close"
        conditions:
          - condition: template
            value_template: "{{ target_position | int(0) == 0 }}"
        sequence:
          - action: cover.close_cover
            target:
              entity_id: "{{ topology_covers }}"
    default:
      - action: cover.set_cover_position
        target:
          entity_id: "{{ topology_covers }}"
        data:
          position: !input target_position
