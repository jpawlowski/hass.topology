# Describes the format for available services for topology (Phase 6, §2/§5).
# Field names, descriptions, and selector option labels are translated via
# translations/en.json (services + selector blocks).

annotate_area:
  fields:
    area_id:
      required: true
      selector:
        area:
    type:
      selector:
        select:
          translation_key: area_type
          custom_value: true
          options:
            - bedroom
            - living
            - kitchen
            - dining
            - bathroom
            - hallway
            - office
            - utility
            - storage
            - garage
            - balcony
            - terrace
            - outdoor
    environment:
      selector:
        select:
          translation_key: environment
          options:
            - indoor
            - outdoor
            - semi_outdoor
    trust:
      selector:
        select:
          translation_key: trust
          options:
            - private
            - shared
            - public

declare_connection:
  fields:
    area_a:
      required: true
      selector:
        area:
    area_b:
      required: true
      selector:
        area:
    preset:
      required: true
      selector:
        select:
          translation_key: connection_preset
          options:
            - interior_door
            - open_passage
            - shared_wall
            - ceiling
            - open_stair
            - enclosed_stair
            - lift
            - loft_ladder
            - ramp
            - hatch
            - window
            - outside_door
    side:
      selector:
        select:
          options:
            - N
            - E
            - S
            - W
    glazed:
      selector:
        boolean:
    sensor:
      selector:
        entity:
          domain: binary_sensor

set_beyond:
  fields:
    area_id:
      required: true
      selector:
        area:
    side:
      required: true
      selector:
        select:
          options:
            - N
            - E
            - S
            - W
    beyond:
      selector:
        select:
          translation_key: beyond
          options:
            - outdoor
            - neighbor
            - earth

set_exterior:
  fields:
    area_id:
      required: true
      selector:
        area:
    connections:
      required: true
      selector:
        object:

set_floor_level:
  fields:
    floor_id:
      required: true
      selector:
        floor:
    level:
      selector:
        number:
          mode: box

project_labels:
  fields:
    scope:
      selector:
        select:
          translation_key: projection_scope
          options:
            - all
            - environment
            - type
            - trust

import_from_core:
  fields:
    source:
      required: true
      selector:
        select:
          translation_key: import_source
          options:
            - aliases
            - labels

# --- read actions (response only) -------------------------------------------
# Each returns its answer in a `response_variable`; they write nothing. These
# are what makes the graph, a connection's `side`/`glazed`/`passage`/`barrier`,
# the full perimeter set, and the health lists reachable from YAML at all —
# none of them is an entity attribute by design.

get_neighbors:
  fields:
    area_id:
      required: true
      selector:
        area:

get_path:
  fields:
    from_area:
      required: true
      selector:
        area:
    to_area:
      required: true
      selector:
        area:
    traversable_only:
      default: false
      selector:
        boolean:

get_perimeter:

get_connections_facing_outdoor:
  fields:
    side:
      selector:
        select:
          multiple: true
          options:
            - N
            - E
            - S
            - W
    glazed_only:
      default: false
      selector:
        boolean:

get_health:

get_model:
