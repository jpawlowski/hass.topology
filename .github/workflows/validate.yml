name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@e3fb68ebda13d88a0d695082f471ba2c83d025fb # master

  hacs: # https://github.com/hacs/action
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # Ignored HACS "include" checks — these are GitHub repository settings,
          # not code, so they cannot be satisfied from within a PR:
          #   brands       — no brand images published yet (see link below)
          #   description  — set a repository description in Settings → General
          #   topics       — add repository topics via the "About" gear
          # Once the repo description + topics are set (and brand images added),
          # drop the matching entries here so the checks run again.
          # https://developers.home-assistant.io/docs/creating_integration_file_structure/#brand-images---brand
          # https://hacs.xyz/docs/publish/include#check-repository
          ignore: brands description topics
