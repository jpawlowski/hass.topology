name: Frontend

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  frontend:
    name: "Panel build + check"
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type-check + unit test the panel
        run: script/frontend-check

      - name: Build the panel bundle
        run: script/frontend

      - name: Assert the committed bundle matches a fresh build
        run: |
          if ! git diff --exit-code -- custom_components/topology/panel/; then
            echo "::error::The committed panel bundle is stale. Run 'script/frontend' and commit the result."
            exit 1
          fi
